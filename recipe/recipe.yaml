schema_version: 1

context:
  version: "4.1.2"

package:
  name: devpi-common
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/devpi-common/devpi_common-${{ version }}.tar.gz
  sha256: b51cb838c7ed60e4d5f81225cf62b917a47034aeb2525502a79414886a53637a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-changelog-shortener
    - wheel
  run:
    - lazy
    - packaging-legacy
    - python >=${{ python_min }}
    - requests >=2.3.0

tests:
  - python:
      imports:
        - devpi_common
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Devpi utilities jointly used by devpi-server and devpi-client
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/devpi/devpi
  repository: https://github.com/devpi/devpi/tree/main/common
  documentation: http://doc.devpi.net/

extra:
  recipe-maintainers:
    - thewchan
